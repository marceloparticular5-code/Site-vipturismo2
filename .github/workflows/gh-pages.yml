name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - atualizar-responsivo

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build client (Vite)
        # Pass --base so assets are referenced correctly on GitHub Pages under repo path
        run: npm run build:client -- --base /Site-vipturismo2/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

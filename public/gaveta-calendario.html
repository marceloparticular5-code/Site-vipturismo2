<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gaveta com Calendário - Natal VIP Turismo</title>

  <!-- =========================================================================
       CSS: ESTILOS DA GAVETA E DO CALENDÁRIO
       Cores e dimensões configuráveis via Variáveis CSS no :root abaixo.
       ========================================================================= -->
  <style>
    /* =========================================================================
       1. VARIÁVEIS DE CORES E TEMA (Mude aqui as cores do seu site)
       ========================================================================= */
    :root {
      /* Fundo e Superfícies */
      --cal-bg-drawer: #071224;         /* Fundo principal da gaveta (Azul Marinho VIP) */
      --cal-bg-card: #0D1B2E;           /* Fundo do card interno do calendário */
      --cal-bg-header: #0B192C;         /* Fundo do cabeçalho do mês */
      --cal-overlay: rgba(3, 7, 18, 0.65); /* Fundo escuro semitransparente ao abrir */

      /* Acentos e Dourados (Padrão Natal VIP) */
      --cal-gold: #F59E0B;              /* Dourado principal / Acentos */
      --cal-gold-light: #FBBF24;        /* Dourado claro para brilhos e hover */
      --cal-gold-glow: rgba(245, 158, 11, 0.35); /* Brilho suave */

      /* Textos */
      --cal-text-title: #FFFFFF;        /* Título e números ativos */
      --cal-text-muted: #94A3B8;        /* Dias de outros meses / legendas */
      --cal-text-week: #FBBF24;         /* Dias da semana (Dom, Seg...) */

      /* Estados dos Dias */
      --cal-today-bg: rgba(245, 158, 11, 0.15); /* Fundo do dia de HOJE */
      --cal-today-border: #F59E0B;              /* Borda do dia de HOJE */
      --cal-selected-bg: #F59E0B;               /* Fundo do dia SELECIONADO */
      --cal-selected-text: #050C16;             /* Cor do texto do dia SELECIONADO */

      /* Dimensões */
      --cal-width-desktop: 340px;       /* Largura no desktop */
      --cal-transition-speed: 0.3s;     /* Velocidade da animação */
    }

    /* Reset básico */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* =========================================================================
       2. BOTÃO FLUTUANTE FIXO NA LATERAL
       ========================================================================= */
    .cal-trigger-btn {
      position: fixed;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      z-index: 9998;
      background: linear-gradient(135deg, var(--cal-gold), #D97706);
      color: #050C16;
      border: none;
      border-radius: 14px 0 0 14px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: -4px 4px 18px rgba(0, 0, 0, 0.4), 0 0 12px var(--cal-gold-glow);
      transition: all var(--cal-transition-speed) ease;
      user-select: none;
    }

    .cal-trigger-btn:hover {
      padding-right: 18px;
      background: linear-gradient(135deg, var(--cal-gold-light), var(--cal-gold));
      box-shadow: -6px 6px 24px rgba(245, 158, 11, 0.5);
    }

    .cal-trigger-icon {
      font-size: 22px;
      line-height: 1;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3));
    }

    .cal-trigger-text {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    /* =========================================================================
       3. OVERLAY (FUNDO ESCURECIDO)
       ========================================================================= */
    .cal-drawer-overlay {
      position: fixed;
      inset: 0;
      background: var(--cal-overlay);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 9999;
      opacity: 0;
      visibility: hidden;
      transition: opacity var(--cal-transition-speed) ease, visibility var(--cal-transition-speed) ease;
    }

    .cal-drawer-overlay.ativo {
      opacity: 1;
      visibility: visible;
    }

    /* =========================================================================
       4. GAVETA LATERAL (SLIDE IN / OUT)
       ========================================================================= */
    .cal-drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: var(--cal-width-desktop);
      max-width: 90%;
      background: var(--cal-bg-drawer);
      color: var(--cal-text-title);
      z-index: 10000;
      transform: translateX(100%);
      transition: transform var(--cal-transition-speed) cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: -10px 0 35px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      border-left: 1px solid rgba(245, 158, 11, 0.3);
      overflow-y: auto;
    }

    .cal-drawer.ativo {
      transform: translateX(0);
    }

    /* Topo da Gaveta */
    .cal-drawer-header {
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(13, 27, 46, 0.6);
    }

    .cal-drawer-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .cal-drawer-title-wrap .cal-icon {
      font-size: 20px;
    }

    .cal-drawer-title {
      font-size: 15px;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: 0.5px;
    }

    .cal-drawer-subtitle {
      font-size: 11px;
      color: var(--cal-gold);
      font-weight: 600;
    }

    /* Botão fechar (X) */
    .cal-drawer-close {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #94A3B8;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: all 0.2s ease;
    }

    .cal-drawer-close:hover {
      background: var(--cal-gold);
      color: #050C16;
      border-color: var(--cal-gold);
    }

    /* Corpo da Gaveta */
    .cal-drawer-body {
      padding: 20px 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* =========================================================================
       5. COMPONENTE DE CALENDÁRIO
       ========================================================================= */
    .cal-container {
      background: var(--cal-bg-card);
      border: 1px solid rgba(245, 158, 11, 0.2);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    /* Navegação do Mês (Setas e Nome do Mês) */
    .cal-month-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .cal-month-label {
      font-size: 15px;
      font-weight: 700;
      color: #FFFFFF;
      text-transform: capitalize;
    }

    .cal-nav-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #FFFFFF;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
      transition: all 0.2s;
    }

    .cal-nav-btn:hover {
      background: var(--cal-gold);
      color: #050C16;
      border-color: var(--cal-gold);
    }

    /* Dias da Semana (D, S, T, Q, Q, S, S) */
    .cal-weekdays-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-bottom: 8px;
      text-align: center;
    }

    .cal-weekday {
      font-size: 11px;
      font-weight: 700;
      color: var(--cal-text-week);
      text-transform: uppercase;
      padding: 4px 0;
    }

    /* Grade dos Dias do Mês */
    .cal-days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      text-align: center;
    }

    .cal-day-cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      color: #E2E8F0;
      cursor: pointer;
      background: transparent;
      border: 1px solid transparent;
      transition: all 0.18s ease;
      position: relative;
      user-select: none;
    }

    .cal-day-cell:hover:not(.outro-mes) {
      background: rgba(245, 158, 11, 0.2);
      border-color: var(--cal-gold);
      color: #FFFFFF;
      transform: scale(1.06);
    }

    /* Dia de outro mês (anterior ou posterior) */
    .cal-day-cell.outro-mes {
      color: var(--cal-text-muted);
      opacity: 0.35;
      cursor: default;
    }

    /* Destaque do Dia de HOJE */
    .cal-day-cell.hoje {
      background: var(--cal-today-bg);
      border: 1.5px solid var(--cal-today-border);
      color: var(--cal-gold-light);
      font-weight: 800;
    }

    .cal-day-cell.hoje::after {
      content: '';
      position: absolute;
      bottom: 3px;
      width: 4px;
      height: 4px;
      background: var(--cal-gold);
      border-radius: 50%;
    }

    /* Destaque do Dia SELECIONADO */
    .cal-day-cell.selecionado {
      background: linear-gradient(135deg, var(--cal-gold-light), var(--cal-gold)) !important;
      color: var(--cal-selected-text) !important;
      font-weight: 800 !important;
      box-shadow: 0 4px 12px var(--cal-gold-glow);
      transform: scale(1.08);
      border-color: transparent !important;
    }

    .cal-day-cell.selecionado::after {
      display: none;
    }

    /* Informações do Dia Selecionado */
    .cal-selected-info {
      background: rgba(245, 158, 11, 0.08);
      border: 1px dashed rgba(245, 158, 11, 0.4);
      border-radius: 12px;
      padding: 12px 14px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .cal-selected-label {
      font-size: 11px;
      color: var(--cal-gold);
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .cal-selected-date-str {
      font-size: 14px;
      font-weight: 800;
      color: #FFFFFF;
    }

    /* Botão de Ação / Confirmar */
    .cal-action-btn {
      background: linear-gradient(135deg, var(--cal-gold), #D97706);
      color: #050C16;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .cal-action-btn:hover {
      background: linear-gradient(135deg, var(--cal-gold-light), var(--cal-gold));
      box-shadow: 0 6px 18px var(--cal-gold-glow);
      transform: translateY(-1px);
    }

    /* Dica de usabilidade no rodapé da gaveta */
    .cal-drawer-footer {
      padding: 12px 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 11px;
      color: var(--cal-text-muted);
      text-align: center;
      line-height: 1.4;
      background: rgba(5, 12, 22, 0.5);
    }

    /* =========================================================================
       6. RESPONSIVIDADE (CELULAR)
       ========================================================================= */
    @media (max-width: 480px) {
      .cal-drawer {
        width: 90%;
      }
      .cal-trigger-btn {
        padding: 10px 12px;
      }
      .cal-trigger-icon {
        font-size: 20px;
      }
      .cal-trigger-text {
        font-size: 10px;
      }
    }
  </style>
</head>
<body>

  <!-- =========================================================================
       HTML: ESTRUTURA DA GAVETA COM CALENDÁRIO
       (Copie e cole este bloco no <body> do seu site)
       ========================================================================= -->

  <!-- 1. Botão Fixo Lateral com Ícone de Calendário -->
  <button id="calBtnTrigger" class="cal-trigger-btn" aria-label="Abrir Calendário" title="Abrir Calendário">
    <span class="cal-trigger-icon">📅</span>
    <span class="cal-trigger-text">Calendário</span>
  </button>

  <!-- 2. Overlay Escurecido -->
  <div id="calOverlay" class="cal-drawer-overlay"></div>

  <!-- 3. Gaveta Deslizante -->
  <aside id="calDrawer" class="cal-drawer" aria-label="Gaveta de Calendário" role="dialog" aria-modal="true">
    <!-- Cabeçalho -->
    <div class="cal-drawer-header">
      <div class="cal-drawer-title-wrap">
        <span class="cal-icon">📅</span>
        <div>
          <div class="cal-drawer-title">Calendário Oficial</div>
          <div class="cal-drawer-subtitle">Escolha a data do seu passeio</div>
        </div>
      </div>
      <button id="calBtnClose" class="cal-drawer-close" aria-label="Fechar Gaveta" title="Fechar">&times;</button>
    </div>

    <!-- Conteúdo -->
    <div class="cal-drawer-body">
      <!-- Container do Calendário -->
      <div class="cal-container">
        <!-- Navegação do Mês -->
        <div class="cal-month-nav">
          <button id="calPrevMonth" class="cal-nav-btn" aria-label="Mês Anterior">&lt;</button>
          <div id="calMonthLabel" class="cal-month-label">Outubro 2026</div>
          <button id="calNextMonth" class="cal-nav-btn" aria-label="Próximo Mês">&gt;</button>
        </div>

        <!-- Dias da Semana -->
        <div class="cal-weekdays-grid">
          <div class="cal-weekday">Dom</div>
          <div class="cal-weekday">Seg</div>
          <div class="cal-weekday">Ter</div>
          <div class="cal-weekday">Qua</div>
          <div class="cal-weekday">Qui</div>
          <div class="cal-weekday">Sex</div>
          <div class="cal-weekday">Sáb</div>
        </div>

        <!-- Grade de Dias -->
        <div id="calDaysGrid" class="cal-days-grid"></div>
      </div>

      <!-- Caixa de Data Selecionada -->
      <div class="cal-selected-info">
        <span class="cal-selected-label">Data Selecionada:</span>
        <span id="calSelectedDisplay" class="cal-selected-date-str">Nenhum dia escolhido</span>
      </div>

      <!-- Botão de Ação -->
      <button id="calBtnConfirmar" class="cal-action-btn">
        <span>Consultar Vagas Nesta Data</span>
        <span>&rarr;</span>
      </button>
    </div>

    <!-- Rodapé explicativo -->
    <div class="cal-drawer-footer">
      💡 Fechamento automático por inatividade (1s sem cursor) ou tecla ESC / toque fora.
    </div>
  </aside>

  <!-- =========================================================================
       JAVASCRIPT PURO (Zero bibliotecas externas)
       (Copie e cole este script antes de </body> no seu site)
       ========================================================================= -->
  <script>
    (function () {
      'use strict';

      /* -----------------------------------------------------------------------
       * CONFIGURAÇÃO E NOMES EM PORTUGUÊS
       * --------------------------------------------------------------------- */
      const MESES = [
        'Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho',
        'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'
      ];

      const DIAS_SEMANA_COMPLETO = [
        'Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira',
        'Quinta-feira', 'Sexta-feira', 'Sábado'
      ];

      // Elementos do DOM
      const btnTrigger = document.getElementById('calBtnTrigger');
      const btnClose = document.getElementById('calBtnClose');
      const overlay = document.getElementById('calOverlay');
      const drawer = document.getElementById('calDrawer');
      const prevBtn = document.getElementById('calPrevMonth');
      const nextBtn = document.getElementById('calNextMonth');
      const monthLabel = document.getElementById('calMonthLabel');
      const daysGrid = document.getElementById('calDaysGrid');
      const selectedDisplay = document.getElementById('calSelectedDisplay');
      const btnConfirmar = document.getElementById('calBtnConfirmar');

      // Estado do Calendário
      const hoje = new Date();
      let dataAtual = new Date(); // Mês e ano em exibição
      let dataSelecionada = new Date(); // Data atualmente selecionada

      let gavetaAberta = false;
      let timerInatividadeMouse = null;
      const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

      /* -----------------------------------------------------------------------
       * 1. FUNÇÃO DE CALLBACK PARA CONECTAR AO SEU SISTEMA (CUSTOMIZE AQUI!)
       * --------------------------------------------------------------------- */
      function aoSelecionarDia(info) {
        console.log('📅 Dia selecionado com sucesso:', info);

        // Atualiza o texto na gaveta
        if (selectedDisplay) {
          selectedDisplay.textContent = `${info.diaDaSemana}, ${info.dataFormatada}`;
        }

        // =====================================================================
        // CONECTE AQUI COM O SEU SISTEMA / CHECKOUT / BUSCA:
        // Exemplo 1: Salvar em input de formulário:
        // const inputData = document.querySelector('#data-reserva');
        // if (inputData) inputData.value = info.dataFormatada;
        //
        // Exemplo 2: Disparar evento personalizado no site:
        window.dispatchEvent(new CustomEvent('dia-selecionado-calendario', { detail: info }));
        // =====================================================================
      }

      // Torna acessível globalmente se o seu sistema externo quiser chamar
      window.aoSelecionarDia = aoSelecionarDia;

      /* -----------------------------------------------------------------------
       * 2. CONTROLE DA GAVETA (ABRIR / FECHAR)
       * --------------------------------------------------------------------- */
      function abrirGaveta() {
        if (gavetaAberta) return;
        gavetaAberta = true;
        drawer.classList.add('ativo');
        overlay.classList.add('ativo');
        cancelarTimerMouse();
        renderizarCalendario();
      }

      function fecharGaveta() {
        if (!gavetaAberta) return;
        gavetaAberta = false;
        drawer.classList.remove('ativo');
        overlay.classList.remove('ativo');
        cancelarTimerMouse();
      }

      function cancelarTimerMouse() {
        if (timerInatividadeMouse) {
          clearTimeout(timerInatividadeMouse);
          timerInatividadeMouse = null;
        }
      }

      function iniciarTimerMouse() {
        // No celular/touch não ativamos mouseleave, fechamos apenas por toque fora
        if (isTouchDevice) return;
        cancelarTimerMouse();
        timerInatividadeMouse = setTimeout(function () {
          fecharGaveta();
        }, 1000); // 1 segundo conforme requisito
      }

      /* -----------------------------------------------------------------------
       * 3. EVENTOS DE FECHAMENTO AUTOMÁTICO
       * --------------------------------------------------------------------- */
      // Clique no botão lateral
      btnTrigger.addEventListener('click', function (e) {
        e.stopPropagation();
        abrirGaveta();
      });

      // Clique no botão X
      btnClose.addEventListener('click', function (e) {
        e.stopPropagation();
        fecharGaveta();
      });

      // Clicar fora (no overlay)
      overlay.addEventListener('click', fecharGaveta);

      // Pressionar tecla ESC
      document.addEventListener('keydown', function (e) {
        if ((e.key === 'Escape' || e.key === 'Esc') && gavetaAberta) {
          fecharGaveta();
        }
      });

      // Tirar o mouse de cima por 1 segundo (apenas computadores/mouse)
      drawer.addEventListener('mouseleave', function () {
        if (gavetaAberta) {
          iniciarTimerMouse();
        }
      });

      // Se o mouse retornar à gaveta antes de 1s, cancela o fechamento
      drawer.addEventListener('mouseenter', function () {
        cancelarTimerMouse();
      });

      /* -----------------------------------------------------------------------
       * 4. RENDERIZAÇÃO DO CALENDÁRIO MENSAL
       * --------------------------------------------------------------------- */
      function renderizarCalendario() {
        const ano = dataAtual.getFullYear();
        const mes = dataAtual.getMonth();

        // Atualiza cabeçalho do mês
        monthLabel.textContent = `${MESES[mes]} ${ano}`;

        // Primeiro dia do mês (0 = Dom, 1 = Seg, ...)
        const primeiroDiaSemana = new Date(ano, mes, 1).getDay();

        // Total de dias no mês atual
        const totalDiasMes = new Date(ano, mes + 1, 0).getDate();

        // Total de dias no mês anterior
        const totalDiasMesAnterior = new Date(ano, mes, 0).getDate();

        // Limpa a grade
        daysGrid.innerHTML = '';

        // 1. Dias do mês anterior para preencher a primeira semana
        for (let i = primeiroDiaSemana - 1; i >= 0; i--) {
          const diaNum = totalDiasMesAnterior - i;
          const celula = document.createElement('div');
          celula.className = 'cal-day-cell outro-mes';
          celula.textContent = diaNum;
          daysGrid.appendChild(celula);
        }

        // 2. Dias do mês atual
        for (let dia = 1; dia <= totalDiasMes; dia++) {
          const celula = document.createElement('div');
          celula.className = 'cal-day-cell';
          celula.textContent = dia;

          // Verifica se é o dia de HOJE
          const ehHoje =
            hoje.getFullYear() === ano &&
            hoje.getMonth() === mes &&
            hoje.getDate() === dia;

          if (ehHoje) {
            celula.classList.add('hoje');
            celula.title = 'Hoje';
          }

          // Verifica se é o dia SELECIONADO
          const ehSelecionado =
            dataSelecionada &&
            dataSelecionada.getFullYear() === ano &&
            dataSelecionada.getMonth() === mes &&
            dataSelecionada.getDate() === dia;

          if (ehSelecionado) {
            celula.classList.add('selecionado');
          }

          // Clique no dia
          celula.addEventListener('click', function () {
            // Remove seleção anterior
            const anterior = daysGrid.querySelector('.cal-day-cell.selecionado');
            if (anterior) anterior.classList.remove('selecionado');

            // Aplica nova seleção
            celula.classList.add('selecionado');
            dataSelecionada = new Date(ano, mes, dia);

            const diaFormatado = String(dia).padStart(2, '0');
            const mesFormatado = String(mes + 1).padStart(2, '0');
            const dataBR = `${diaFormatado}/${mesFormatado}/${ano}`;
            const dataISO = `${ano}-${mesFormatado}-${diaFormatado}`;
            const diaSemanaNome = DIAS_SEMANA_COMPLETO[dataSelecionada.getDay()];

            // Dispara a função do usuário
            aoSelecionarDia({
              data: dataSelecionada,
              dataFormatada: dataBR,
              dataISO: dataISO,
              dia: dia,
              mes: mes + 1,
              ano: ano,
              diaDaSemana: diaSemanaNome
            });
          });

          daysGrid.appendChild(celula);
        }

        // 3. Preencher dias do próximo mês para completar a grade em múltiplos de 7
        const totalCelulas = primeiroDiaSemana + totalDiasMes;
        const celulasRestantes = (totalCelulas % 7 === 0) ? 0 : 7 - (totalCelulas % 7);

        for (let diaProx = 1; diaProx <= celulasRestantes; diaProx++) {
          const celula = document.createElement('div');
          celula.className = 'cal-day-cell outro-mes';
          celula.textContent = diaProx;
          daysGrid.appendChild(celula);
        }
      }

      /* -----------------------------------------------------------------------
       * 5. NAVEGAÇÃO ENTRE MESES (SETAS < e >)
       * --------------------------------------------------------------------- */
      prevBtn.addEventListener('click', function () {
        dataAtual.setMonth(dataAtual.getMonth() - 1);
        renderizarCalendario();
      });

      nextBtn.addEventListener('click', function () {
        dataAtual.setMonth(dataAtual.getMonth() + 1);
        renderizarCalendario();
      });

      // Botão de confirmação dentro da gaveta
      btnConfirmar.addEventListener('click', function () {
        if (!dataSelecionada) {
          alert('Por favor, clique em um dia no calendário primeiro.');
          return;
        }
        const diaFmt = String(dataSelecionada.getDate()).padStart(2, '0');
        const mesFmt = String(dataSelecionada.getMonth() + 1).padStart(2, '0');
        const anoFmt = dataSelecionada.getFullYear();
        const dataStr = `${diaFmt}/${mesFmt}/${anoFmt}`;

        console.log('Consulta iniciada para data:', dataStr);
        // Exemplo: se existir função de reserva no seu site, pode chamar aqui:
        // if (window.iniciarReservaComData) window.iniciarReservaComData(dataStr);
        fecharGaveta();
      });

      // Inicializa a seleção inicial com o dia de hoje
      const diaInicialFmt = String(hoje.getDate()).padStart(2, '0');
      const mesInicialFmt = String(hoje.getMonth() + 1).padStart(2, '0');
      aoSelecionarDia({
        data: hoje,
        dataFormatada: `${diaInicialFmt}/${mesInicialFmt}/${hoje.getFullYear()}`,
        dataISO: `${hoje.getFullYear()}-${mesInicialFmt}-${diaInicialFmt}`,
        dia: hoje.getDate(),
        mes: hoje.getMonth() + 1,
        ano: hoje.getFullYear(),
        diaDaSemana: DIAS_SEMANA_COMPLETO[hoje.getDay()]
      });

    })();
  </script>
